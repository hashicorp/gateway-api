apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: invalid-filter-externalauth-empty
spec:
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            http:
              path: /[]
